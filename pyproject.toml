[project]
name = "wiki-fetch"
version = "1.0.0"
description = "Wikipedia parser for Python and the CLI. Dependency-free."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
authors = [{ name = "d3z", email = "d3z.the.dev@gmail.com" }]
keywords = ["parser", "wiki", "wikipedia", "scraping", "stdlib"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Wiki",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/d3z-the-dev/wiki-fetch"
Repository = "https://github.com/d3z-the-dev/wiki-fetch"
Issues = "https://github.com/d3z-the-dev/wiki-fetch/issues"

[project.scripts]
wiki-fetch = "wiki_fetch.cli.app:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "TID", "RUF", "ANN", "PL"]
ignore = ["ANN401", "C408", "UP007", "UP018", "UP045"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: hits live Wikipedia",
    "golden: full-output comparison",
]
